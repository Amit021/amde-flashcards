<!-- flashcards/templates/flashcards/completed.html -->

{% extends 'flashcards/base.html' %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="notification has-text-centered">
            <h1 class="title is-3">Congratulations!</h1>
            <p class="subtitle is-5">You have mastered all flashcards in the stack "<strong>{{ stack.name }}</strong>".</p>
            <hr>
            <p>Well done on your progress!</p>

            <!-- Link to Select Another Stack -->
            <div class="buttons is-centered mt-4">
                <a href="{% url 'select_stack' %}" class="button is-outlined">Select Another Stack &rarr;</a>
            </div>

            <!-- Reset Progress Button -->
            <form method="POST" action="{% url 'reset_progress' %}" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="button is-outlined">Reset Progress for This Stack</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
