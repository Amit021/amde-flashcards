<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout | German Flashcards</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .logout-container {
            text-align: center;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 450px;
        }
        .logout-container h1 {
            font-size: 24px;
            color: #333;
        }
        .logout-container p {
            color: #666;
            margin-bottom: 20px;
        }
        .logout-container button {
            width: 100%;
            margin-top: 15px;
        }
        .logout-container a.btn-link {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>Are you sure you want to sign out?</h1>
        <p>If you sign out, you will need to log in again to access your flashcards.</p>
        
        <!-- Logout form -->
        <form method="POST" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Yes, Sign Out</button>
        </form>

        <!-- Cancel link -->
        <a href="/" class="btn btn-link">Cancel</a>
    </div>
</body>
</html>
